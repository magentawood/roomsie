name: deploy-api
on:
  push:
    branches: [main]
    paths:
      - apps/api/**
      - packages/**
      - pnpm-lock.yaml
      - .github/workflows/deploy-api.yml
  workflow_dispatch:
concurrency:
  group: deploy-api
env:
  SERVICE: roomsie-api
  WEB_ORIGIN: https://roomsie.vercel.app
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1
      - name: Install lightsailctl
        run: |
          sudo curl -sSfL -o /usr/local/bin/lightsailctl https://s3.us-west-2.amazonaws.com/lightsailctl/latest/linux-amd64/lightsailctl
          sudo chmod +x /usr/local/bin/lightsailctl
      - run: docker build -f apps/api/Dockerfile -t "$SERVICE:$GITHUB_SHA" .
      - name: Push the image
        run: |
          image=$(aws lightsail push-container-image --service-name "$SERVICE" --label api --image "$SERVICE:$GITHUB_SHA" | grep -o ":$SERVICE\.api\.[0-9]*" | head -1)
          test -n "$image"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
      # Lightsail has no secret store, so each deployment carries the API secrets (ADR-0016).
      # jq passes each API_* variable to the container without the prefix.
      - name: Deploy
        env:
          API_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          API_ANALYTICS_DATABASE_URL: ${{ secrets.ANALYTICS_DATABASE_URL }}
          API_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          API_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          API_R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          API_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          API_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          API_R2_BUCKET_PHOTOS: ${{ secrets.R2_BUCKET_PHOTOS }}
          API_R2_BUCKET_PRIVATE: ${{ secrets.R2_BUCKET_PRIVATE }}
          API_R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          API_DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          API_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          API_SENTRY_DSN_API: ${{ secrets.SENTRY_DSN_API }}
          API_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          jq -n --arg image "$IMAGE" '{
            containers: { api: {
              image: $image,
              ports: { "8080": "HTTP" },
              environment: ({ WEB_ORIGIN: $ENV.WEB_ORIGIN }
                + ($ENV | with_entries(select(.key | startswith("API_")) | .key |= ltrimstr("API_"))))
            } },
            publicEndpoint: { containerName: "api", containerPort: 8080, healthCheck: { path: "/v1/health" } }
          }' > deployment.json
          # The response repeats the environment, so print only the version.
          version=$(aws lightsail create-container-service-deployment --service-name "$SERVICE" \
            --cli-input-json file://deployment.json --query 'containerService.nextDeployment.version' --output text)
          rm deployment.json
          for _ in $(seq 60); do
            state=$(aws lightsail get-container-service-deployments --service-name "$SERVICE" \
              --query "deployments[?version==\`$version\`].state | [0]" --output text)
            echo "deployment $version: $state"
            [ "$state" = ACTIVE ] && exit 0
            [ "$state" = FAILED ] && exit 1
            sleep 20
          done
          exit 1
      - name: Smoke check
        run: |
          url=$(aws lightsail get-container-services --service-name "$SERVICE" --query 'containerServices[0].url' --output text)
          curl --fail --silent --retry 5 --retry-all-errors --retry-delay 5 "${url%/}/v1/health" | grep -q '"status":"ok"'
